name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm run postinstall

      - name: Check format
        id: format
        continue-on-error: true
        run: npm run check:format

      - name: Check lint
        id: lint
        continue-on-error: true
        run: npm run check:lint

      - name: Check Type
        id: compile
        continue-on-error: true
        run: npm run check:compile

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: npm run test

      - name: Fail if any check failed
        if: steps.format.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "One or more checks failed."
          exit 1
